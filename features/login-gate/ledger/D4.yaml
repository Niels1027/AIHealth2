title: 产品名保留「健康问书」，副标题改口语化
conclusion: 「健康咨询」不采纳：一、「书」是差异化根基——所有回答出自导入书籍原文、句句可查，去掉「书」就和普通健康问答机器人没区别；二、「咨询」在健康领域带医疗合规暗示，与现网免责声明「不构成医疗建议」相冲突；三、改名要同时动 layout.tsx 的 title、icon.svg 的「问」字和首页文案，不是改一个字符串。但提出的痛点成立——原副标题「基于《超越百岁》等书籍原文回答，每个结论都可溯源」是产品视角措辞，「可溯源」属术语。登录页副标题改为「答案都从《超越百岁》等书里找，每句话都能翻到出处」。仅改登录页第一印象文案，ChatApp 空状态那句保留不动。
