title: "主 CTA 改为亮黄 #f0c33c + 墨色字，苔绿退为品牌与状态色"
conclusion: "「开始体验」按钮从苔绿实心（#2f6d5a + 白字）改为亮黄实心（#f0c33c + 墨字 #1f2725），hover #e3b52b。目的是让主入口更抢眼。三点约束：一、必须配深墨字，不得白字——黄底白字对比度仅 1.67:1，完全不可读；现方案 9.15:1，比原苔绿白字的 6.08:1 还高。二、由此登录页出现双色分工：苔绿=品牌与状态（「问」标记、知识库状态点、聚焦环），亮黄=唯一动作色，全页只此一处。三、明知的取舍——此前答复 Niels 时指出「登录页单独换色会与主界面割裂」，本决定接受该割裂：黄色只作用于登录页 CTA，globals.css 的 --color-moss 全站主色不动，不改设计系统。若日后要让主界面发送按钮等一致，需另立决策。"
